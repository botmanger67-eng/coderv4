[project]
name = "telegram-github-bot"
version = "0.1.0"
description = "A Telegram bot that integrates with GitHub and OpenAI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]
keywords = ["telegram", "github", "openai", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["telegram_github_bot*"]

[tool.setuptools.package-data]
telegram_github_bot = ["py.typed"]

[project.scripts]
telegram-github-bot = "telegram_github_bot.__main__:main"

[project.urls]
Homepage = "https://github.com/example/telegram-github-bot"
Repository = "https://github.com/example/telegram-github-bot.git"
Documentation = "https://github.com/example/telegram-github-bot#readme"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["telegram_github_bot"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG",
    "PTH", "RSE", "RET", "SLF", "TCH", "TID", "ISC", "ICN", "G",
    "INP", "PIE", "PL", "PT", "Q", "RUF", "S", "T10", "TRY",
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert allowed in tests
    "PLR2004",  # magic value comparison
    "PLR0913",  # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ARG001"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.loguru]
level = "DEBUG"
rotation = "10 MB"
retention = "1 month"
compression = "zip"